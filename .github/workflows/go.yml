name: Go
on:
  push:
    branches: [master, mysql_testing,self-hostable]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.13
      uses: actions/setup-go@v1
      with:
        go-version: 1.13
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v2

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi

    - name: Build
      run: go build -v .
    - name: Identify (1/2)
      run: git config --global user.email totallyrealemail@gmail.com
    - name: Identify (2/2)
      run: git config --global user.name "Phlox - Actions Edition"
    - name: Upload (1/3)
      run: git init
    - name: Upload (2/3)
      run: git pull https://github.com/srckat/outrun
    - name: Upload (3/3)
      run: git add outrun -f
    - name: Commit Changes
      run: git commit -m OutrunBuild
    - name: Push Changes
      run: git push
